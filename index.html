<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>drop file here</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #737373;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-black w-screen h-screen overflow-hidden select-none">

  <!-- Hidden Universal File Input (accepts any file type) -->
  <input
    id="file-input"
    type="file"
    class="hidden"
    aria-hidden="true"
  />

  <!-- Pure Black Drop / Click Screen -->
  <main
    id="drop-screen"
    role="button"
    tabindex="0"
    aria-label="Drop file here or click to choose a file"
    class="w-full h-full bg-black flex flex-col items-center justify-center cursor-pointer focus:outline-none"
  >
    <p
      id="drop-label"
      class="text-xs sm:text-sm font-normal tracking-wide text-neutral-500 transition-colors duration-150"
    >
      drop file here
    </p>
    <p
      id="status-label"
      class="mt-2 text-[11px] text-rose-400/90 opacity-0 transition-opacity duration-200 pointer-events-none"
    ></p>
  </main>

  <!-- Drag Overlay (only visible while actively dragging a file over a running view) -->
  <div
    id="drag-overlay"
    class="hidden fixed inset-0 z-30 bg-black/90 flex items-center justify-center pointer-events-none"
  >
    <p class="text-xs sm:text-sm font-normal tracking-wide text-neutral-300">
      drop file here
    </p>
  </div>

  <!-- Fullscreen Sandbox Iframe (100% viewport, zero toolbars, pointer-lock enabled) -->
  <iframe
    id="runner-frame"
    title="File Runner"
    sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-downloads allow-pointer-lock allow-orientation-lock"
    allow="pointer-lock; fullscreen; autoplay; gamepad; keyboard-map; clipboard-read; clipboard-write"
    class="hidden fixed inset-0 w-screen h-screen border-0 bg-black z-20"
  ></iframe>

  <script>
    (function () {
      'use strict';

      // 500 MB hard limit in bytes
      const MAX_BYTES = 500 * 1024 * 1024;

      const fileInput = document.getElementById('file-input');
      const dropScreen = document.getElementById('drop-screen');
      const dropLabel = document.getElementById('drop-label');
      const statusLabel = document.getElementById('status-label');
      const dragOverlay = document.getElementById('drag-overlay');
      const runnerFrame = document.getElementById('runner-frame');

      let activeObjectUrl = null;
      let isRunning = false;
      let dragCounter = 0;
      let statusTimer = null;

      /**
       * Shows a brief subtle message below "drop file here" (e.g., if > 50 MB).
       */
      function showStatus(text) {
        if (statusTimer) clearTimeout(statusTimer);
        statusLabel.textContent = text;
        statusLabel.classList.remove('opacity-0');
        statusLabel.classList.add('opacity-100');
        statusTimer = setTimeout(() => {
          statusLabel.classList.add('opacity-0');
          statusLabel.classList.remove('opacity-100');
        }, 3000);
      }

      /**
       * Frees the current Object URL to avoid memory leaks on large files.
       */
      function cleanupUrl() {
        if (activeObjectUrl) {
          try {
            URL.revokeObjectURL(activeObjectUrl);
          } catch (_) {}
          activeObjectUrl = null;
        }
      }

      /**
       * Creates a playable Object URL for any file:
       * - Preserves native MIME types (HTML, SVG, PDF, images, video, audio, text, etc.)
       * - Defaults unknown/extensionless binary MIME types to text/html so offline HTML bundles run directly
       */
      function createPlayableUrl(file) {
        if (!file.type || file.type === 'application/octet-stream') {
          return URL.createObjectURL(new Blob([file], { type: 'text/html' }));
        }
        return URL.createObjectURL(file);
      }

      /**
       * Loads and runs any file up to 50 MB inside the full-viewport iframe.
       */
      function runFile(file) {
        if (!file) return;

        if (file.size > MAX_BYTES) {
          const mb = (file.size / (1024 * 1024)).toFixed(1);
          showStatus(`max size is 50 mb (${mb} mb)`);
          return;
        }

        cleanupUrl();
        activeObjectUrl = createPlayableUrl(file);
        isRunning = true;

        dropScreen.classList.add('hidden');
        runnerFrame.classList.remove('hidden');
        runnerFrame.src = activeObjectUrl;
      }

      /**
       * Exits the running file via Backslash (\), unlocks pointer if locked,
       * and returns to the pure black "drop file here" screen.
       */
      function exitRunner() {
        if (!isRunning) return;

        try {
          const doc = runnerFrame.contentDocument;
          if (doc && doc.pointerLockElement && doc.exitPointerLock) {
            doc.exitPointerLock();
          }
          if (document.pointerLockElement && document.exitPointerLock) {
            document.exitPointerLock();
          }
        } catch (_) {}

        if (document.fullscreenElement) {
          document.exitFullscreen().catch(() => {});
        }

        runnerFrame.src = 'about:blank';
        runnerFrame.classList.add('hidden');
        dropScreen.classList.remove('hidden');

        cleanupUrl();
        isRunning = false;
        fileInput.value = '';
      }

      /**
       * Non-intrusive key listener: ONLY listens for '\' to exit.
       * Never intercepts, blocks, or steals WASD, Space, Tab, T, E, Esc, or arrow keys.
       */
      function onKeyDownExitOnly(e) {
        if (isRunning && (e.key === '\u005C' || e.code === 'Backslash')) {
          e.preventDefault();
          exitRunner();
        }
      }

      // Give the iframe initial focus once on load without taking over keyboard events
      runnerFrame.addEventListener('load', () => {
        if (!isRunning) return;
        try {
          runnerFrame.focus();
          if (runnerFrame.contentWindow) {
            runnerFrame.contentWindow.focus();
            runnerFrame.contentWindow.addEventListener('keydown', onKeyDownExitOnly, true);
          }
        } catch (_) {}
      });

      window.addEventListener('keydown', onKeyDownExitOnly, true);

      // Click or Enter/Space on the black screen opens the file picker
      dropScreen.addEventListener('click', () => fileInput.click());
      dropScreen.addEventListener('keydown', (e) => {
        if (!isRunning && (e.key === 'Enter' || e.key === ' ')) {
          e.preventDefault();
          fileInput.click();
        }
      });

      fileInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) runFile(file);
      });

      // Hover state on black screen
      dropScreen.addEventListener('mouseenter', () => {
        dropLabel.classList.replace('text-neutral-500', 'text-neutral-300');
      });
      dropScreen.addEventListener('mouseleave', () => {
        dropLabel.classList.replace('text-neutral-300', 'text-neutral-500');
      });

      // Global Drag & Drop anywhere on the window (works both on black screen and over running content)
      function hasFiles(e) {
        return e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
      }

      window.addEventListener('dragenter', (e) => {
        if (!hasFiles(e)) return;
        e.preventDefault();
        dragCounter++;
        dropLabel.classList.replace('text-neutral-500', 'text-neutral-200');
        if (isRunning) {
          dragOverlay.classList.remove('hidden');
        }
      });

      window.addEventListener('dragover', (e) => {
        if (!hasFiles(e)) return;
        e.preventDefault();
      });

      window.addEventListener('dragleave', (e) => {
        if (!hasFiles(e)) return;
        dragCounter = Math.max(0, dragCounter - 1);
        if (dragCounter === 0) {
          dropLabel.classList.replace('text-neutral-200', 'text-neutral-500');
          dragOverlay.classList.add('hidden');
        }
      });

      window.addEventListener('drop', (e) => {
        if (!hasFiles(e)) return;
        e.preventDefault();
        dragCounter = 0;
        dropLabel.classList.replace('text-neutral-200', 'text-neutral-500');
        dragOverlay.classList.add('hidden');

        const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (file) runFile(file);
      });

      window.addEventListener('beforeunload', cleanupUrl);
    })();
  </script>
</body>
</html>
